
name: CIA2 CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build and test
      - name: Build and test application
        run: mvn clean test

      # 4. Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build and push image to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            eniyam/cia2-cicd:latest
            eniyam/cia2-cicd:${{ github.sha }}

      # 7. Authenticate with Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # 8. Set up Google Cloud CLI
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # 9. Configure Docker authentication for Artifact Registry
      - name: Configure Docker authentication
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # 10. Build and push image to Artifact Registry
      - name: Push image to Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cia2-images/cia2-cicd:${{ github.sha }}

      # 11. Deploy to Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cia2-images/cia2-cicd:${{ github.sha }}

      # 12. Install Ansible
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      # 13. Verify deployment with Ansible
      - name: Verify deployment with Ansible
        run: ansible-playbook ansible/verify-deployment.yml
